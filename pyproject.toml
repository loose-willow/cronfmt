[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cronfmt"
version = "0.1.0"
description = "Normalize messy cron expressions into a canonical form"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loose-willow" }]

[tool.setuptools.packages.find]
include = ["cronfmt*"]
